name: SeMá diario

on:
  # Programación en pausa desde el 25-11-2026: se borraron los datos para cambiar el método de extracción.
  # Para reactivarla, vuelve a poner aquí:
  #   schedule:
  #     - cron: "43 7 * * *"
  #     - cron: "43 13 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial AAAA-MM-DD (opcional, para recargar un rango)"
        required: false
      forzar_justicia:
        description: "Descargar también el CSV de Justicia aunque no sea lunes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sema
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas sin red
        id: pruebas
        run: python -m unittest discover -s tests -v

      - name: Ejecutar SeMá
        env:
          SUBASTASBOEAPI_TOKEN: ${{ secrets.SUBASTASBOEAPI_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.desde }}" ]; then ARGS="$ARGS --desde ${{ github.event.inputs.desde }}"; fi
          if [ "${{ github.event.inputs.forzar_justicia }}" = "true" ]; then ARGS="$ARGS --forzar-justicia"; fi
          python sema.py run $ARGS

      - name: SeMá Deal Finder (solo BOE)
        # Anuncios de las secciones IV, V.B y V.C del sumario (JSON) y su XML. Las fichas del Portal solo se
        # leen de datos/portal/entrada (consultas puntuales guardadas a mano): no se descarga nada del Portal.
        if: ${{ !cancelled() && steps.pruebas.outcome == 'success' }}
        env:
          SEMA_DF_MAX_XML: "1500"
        run: |
          if find datos/portal/entrada -iname '*.pdf' 2>/dev/null | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa
          fi
          ARGS=""
          if [ -n "${{ github.event.inputs.desde }}" ]; then ARGS="$ARGS --desde ${{ github.event.inputs.desde }}"; fi
          python sema.py dealfinder $ARGS

      - name: Publicar el informe en el resumen de la ejecución
        if: always()
        run: |
          if [ -f datos/ultimo_informe.md ]; then cat datos/ultimo_informe.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f datos/ultimo_informe_dealfinder.md ]; then cat datos/ultimo_informe_dealfinder.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "sema-bot"
          git config user.email "sema-bot@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "SeMá: ejecución $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
