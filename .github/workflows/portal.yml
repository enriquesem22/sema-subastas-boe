name: Portal de Subastas (códigos y fichas)

# Método nuevo. Paso 1: códigos SUB de las subastas «Celebrándose» con el bien en la provincia (portal_codigos.py).
# Paso 2: ficha completa de cada código (portal_fichas.py). Paso 3: base de datos datos/subastas.sqlite y tablas del
# panel (portal_base.py, sin peticiones). Paso 4: ubicación de cada inmueble con el Catastro y CartoCiudad y
# comprobación de su dirección (portal_geo.py). Paso 5: mapas de detalle del Catastro y del IGN (portal_mapas.py).
# Los pasos 4 y 5 guardan las respuestas y no repiten las ya hechas. Todo se guarda en el repositorio.
# Cada día de madrugada, Sevilla (41) y después Huelva (21): dos intentos, porque GitHub puede retrasar mucho los
# programados; el segundo solo descarga la provincia que el primero no haya descargado ese día. También a mano: pestaña
# Actions → este flujo → Run workflow, con una provincia o varias separadas por espacios. La tarea programada de Claude
# «SeMá · Subida diaria a Drive» sube después el resultado a Google Drive.
on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      provincia:
        description: "Provincia del bien, código con dos cifras (41 Sevilla, 28 Madrid, 08 Barcelona, 21 Huelva); varias, separadas por espacios"
        required: false
        default: "41 21"
      solo_codigos:
        description: "Sacar solo los códigos, sin descargar las fichas"
        type: boolean
        default: false
      solo_ubicaciones:
        description: "Solo ubicar los inmuebles y rehacer la base, sin pedir nada al Portal"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sema
  cancel-in-progress: false

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Programado: Sevilla y luego Huelva. A mano: las que se escriban.
      PROVINCIAS: ${{ github.event.inputs.provincia || '41 21' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ¿Está ya la descarga de hoy?
        id: hoy
        run: |
          HOY=$(TZ=Europe/Madrid date +%Y%m%d)
          PENDIENTES=""
          for P in $PROVINCIAS; do
            if [ "${{ github.event_name }}" = "schedule" ] && ls -d datos/portal/codigos/"$P"/"${HOY}"_* >/dev/null 2>&1; then
              echo "La descarga de hoy ($HOY) de la provincia $P ya está hecha: este intento programado no la repite." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              PENDIENTES="$PENDIENTES $P"
            fi
          done
          PENDIENTES="${PENDIENTES# }"
          echo "provincias=$PENDIENTES" >> "$GITHUB_OUTPUT"
          if [ -z "$PENDIENTES" ]; then echo "hecha=true" >> "$GITHUB_OUTPUT"; else echo "hecha=false" >> "$GITHUB_OUTPUT"; fi

      - name: Pruebas sin red
        if: ${{ steps.hoy.outputs.hecha != 'true' }}
        run: |
          pip install -q pillow
          python -m unittest tests.test_portal_codigos tests.test_portal_fichas tests.test_portal_base tests.test_portal_geo tests.test_portal_mapas -v

      # Una provincia tras otra, en el orden escrito (Sevilla primero). Si la búsqueda de una falla, las demás siguen;
      # el paso 2 solo descarga las fichas de las provincias cuya búsqueda salió bien.
      - name: "Paso 1: códigos SUB activos"
        id: codigos
        if: ${{ steps.hoy.outputs.hecha != 'true' && github.event.inputs.solo_ubicaciones != 'true' }}
        env:
          PENDIENTES: ${{ steps.hoy.outputs.provincias }}
        run: |
          OK=""; FALLOS=""
          for P in $PENDIENTES; do
            if python portal_codigos.py --provincia "$P" --resumen "$GITHUB_STEP_SUMMARY"; then OK="$OK $P"; else FALLOS="$FALLOS $P"; fi
          done
          echo "ok=${OK# }" >> "$GITHUB_OUTPUT"
          if [ -n "$FALLOS" ]; then echo "Búsqueda fallida en la provincia:$FALLOS" >&2; exit 1; fi

      - name: "Paso 2: ficha de cada subasta"
        if: ${{ !cancelled() && steps.codigos.outputs.ok != '' && github.event.inputs.solo_codigos != 'true' && github.event.inputs.solo_ubicaciones != 'true' }}
        env:
          OK: ${{ steps.codigos.outputs.ok }}
        run: |
          FALLOS=""
          for P in $OK; do
            python portal_fichas.py --provincia "$P" --resumen "$GITHUB_STEP_SUMMARY" || FALLOS="$FALLOS $P"
          done
          if [ -n "$FALLOS" ]; then echo "Fichas con errores en la provincia:$FALLOS" >&2; exit 1; fi

      - name: "Paso 3: base de datos y tablas del panel"
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' }}
        run: python portal_base.py

      - name: "Paso 4: ubicación de los inmuebles (Catastro y CartoCiudad)"
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' && github.event.inputs.solo_codigos != 'true' }}
        run: python portal_geo.py

      - name: "Paso 5: mapas de detalle de cada inmueble (Catastro y ortofoto PNOA)"
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' && github.event.inputs.solo_codigos != 'true' }}
        run: python portal_mapas.py

      - name: Guardar en el repositorio
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' }}
        env:
          HECHAS: ${{ steps.hoy.outputs.provincias }}
        run: |
          git config user.name "sema-bot"
          git config user.email "sema-bot@users.noreply.github.com"
          git add datos/portal datos/subastas.sqlite
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -q -m "Portal: códigos y fichas, provincias $HECHAS, $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull -q --rebase origin main
            git push -q
          fi
