name: Portal de Subastas (códigos y fichas)

# Método nuevo. Paso 1: códigos SUB de las subastas «Celebrándose» con el bien en la provincia (portal_codigos.py).
# Paso 2: ficha completa de cada código (portal_fichas.py). Paso 3: base de datos datos/subastas.sqlite y tablas del
# panel (portal_base.py, sin peticiones). Paso 4: ubicación de cada inmueble con el Catastro y CartoCiudad y
# comprobación de su dirección (portal_geo.py). Paso 5: mapas de detalle del Catastro y del IGN (portal_mapas.py).
# Los pasos 4 y 5 guardan las respuestas y no repiten las ya hechas. Todo se guarda en el repositorio.
# Cada día de madrugada (dos intentos, porque GitHub puede retrasar mucho los programados; el segundo no hace nada si
# el primero ya descargó ese día) o a mano: pestaña Actions → este flujo → Run workflow. La tarea programada de Claude
# «SeMá · Subida diaria a Drive» sube después el resultado a Google Drive.
on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      provincia:
        description: "Provincia del bien, código con dos cifras (41 Sevilla, 28 Madrid, 08 Barcelona, 21 Huelva)"
        required: false
        default: "41"
      solo_codigos:
        description: "Sacar solo los códigos, sin descargar las fichas"
        type: boolean
        default: false
      solo_ubicaciones:
        description: "Solo ubicar los inmuebles y rehacer la base, sin pedir nada al Portal"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sema
  cancel-in-progress: false

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROVINCIA: ${{ github.event.inputs.provincia || '41' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ¿Está ya la descarga de hoy?
        id: hoy
        run: |
          HOY=$(TZ=Europe/Madrid date +%Y%m%d)
          if [ "${{ github.event_name }}" = "schedule" ] && ls -d datos/portal/codigos/"$PROVINCIA"/"${HOY}"_* >/dev/null 2>&1; then
            echo "hecha=true" >> "$GITHUB_OUTPUT"
            echo "La descarga de hoy ($HOY) ya está hecha: este intento programado no la repite." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "hecha=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pruebas sin red
        if: ${{ steps.hoy.outputs.hecha != 'true' }}
        run: |
          pip install -q pillow
          python -m unittest tests.test_portal_codigos tests.test_portal_fichas tests.test_portal_base tests.test_portal_geo tests.test_portal_mapas -v

      - name: "Paso 1: códigos SUB activos"
        id: codigos
        if: ${{ steps.hoy.outputs.hecha != 'true' && github.event.inputs.solo_ubicaciones != 'true' }}
        run: python portal_codigos.py --provincia "$PROVINCIA" --resumen "$GITHUB_STEP_SUMMARY"

      - name: "Paso 2: ficha de cada subasta"
        if: ${{ steps.codigos.outcome == 'success' && github.event.inputs.solo_codigos != 'true' && github.event.inputs.solo_ubicaciones != 'true' }}
        run: python portal_fichas.py --provincia "$PROVINCIA" --resumen "$GITHUB_STEP_SUMMARY"

      - name: "Paso 3: base de datos y tablas del panel"
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' }}
        run: python portal_base.py

      - name: "Paso 4: ubicación de los inmuebles (Catastro y CartoCiudad)"
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' && github.event.inputs.solo_codigos != 'true' }}
        run: python portal_geo.py

      - name: "Paso 5: mapas de detalle de cada inmueble (Catastro y ortofoto PNOA)"
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' && github.event.inputs.solo_codigos != 'true' }}
        run: python portal_mapas.py

      - name: Guardar en el repositorio
        if: ${{ !cancelled() && steps.hoy.outputs.hecha != 'true' }}
        run: |
          git config user.name "sema-bot"
          git config user.email "sema-bot@users.noreply.github.com"
          git add datos/portal datos/subastas.sqlite
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -q -m "Portal: códigos y fichas, provincia $PROVINCIA, $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull -q --rebase origin main
            git push -q
          fi
